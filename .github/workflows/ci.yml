name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Compile check
        run: |
          for f in $(find src -name '*.py' -not -path '*/_generated/*'); do
            python -m py_compile "$f" || exit 1
          done
          echo "All Python files compile OK"
      - name: Unit tests
        run: python tests/test_integration.py

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pyinstaller upx-ucl 2>/dev/null || pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller panda-ai.spec --clean
      - name: Compress binary
        run: |
          if [ -f dist/panda-ai ]; then
            upx --best --lzma dist/panda-ai 2>/dev/null || true
            tar czf dist/panda-ai-linux-x64.tar.gz -C dist panda-ai
          elif [ -d dist/panda-ai ]; then
            tar czf dist/panda-ai-linux-x64.tar.gz -C dist panda-ai
          fi
          ls -lh dist/panda-ai-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: panda-ai-linux-x64
          path: dist/panda-ai-linux-x64.tar.gz
          compression-level: 9

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller panda-ai.spec --clean
      - name: Package
        run: |
          cd dist
          if [ -d panda-ai ]; then
            tar czf panda-ai-macos-x64.tar.gz panda-ai/
          elif [ -f panda-ai ]; then
            tar czf panda-ai-macos-x64.tar.gz panda-ai
          fi
          ls -lh panda-ai-macos-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: panda-ai-macos-x64
          path: dist/panda-ai-macos-x64.tar.gz
          compression-level: 9

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller panda-ai.spec --clean
      - name: Package
        shell: pwsh
        run: |
          Set-Location dist
          if (Test-Path panda-ai) {
            Compress-Archive -Path panda-ai -DestinationPath panda-ai-windows-x64.zip -Force
          } elseif (Test-Path panda-ai.exe) {
            Compress-Archive -Path panda-ai.exe -DestinationPath panda-ai-windows-x64.zip -Force
          } else {
            Write-Error 'No binary found in dist/'
            exit 1
          }
          Get-Item panda-ai-windows-x64.zip | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: panda-ai-windows-x64
          path: dist/panda-ai-windows-x64.zip
          compression-level: 9

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk || (echo 'APK not found' && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: panda-ai-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t panda-ai:latest .
      - name: Test Docker
        run: |
          docker run -d --name test --shm-size=1g -p 8000:8000 panda-ai:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz > /dev/null 2>&1 && echo 'OK' && docker stop test && exit 0
            sleep 2
          done
          docker logs test; docker stop test; exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f -ls
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/panda-ai-linux-x64/panda-ai-linux-x64.tar.gz
            artifacts/panda-ai-macos-x64/panda-ai-macos-x64.tar.gz
            artifacts/panda-ai-windows-x64/panda-ai-windows-x64.zip
            artifacts/panda-ai-android/app-debug.apk
