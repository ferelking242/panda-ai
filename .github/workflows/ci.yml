name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Compile check
        run: |
          python -m py_compile src/config.py
          python -m py_compile src/api/server.py
          python -m py_compile src/api/openai_routes.py
          python -m py_compile src/tokens.py
      - name: Unit tests
        run: python tests/test_integration.py

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller panda-ai.spec --clean
      - name: Package
        run: |
          cd dist
          # PyInstaller 6.x creates a folder with _internal
          if [ -d panda-ai ]; then
            tar czf panda-ai-linux-x64.tar.gz panda-ai/
          elif [ -f panda-ai ]; then
            tar czf panda-ai-linux-x64.tar.gz panda-ai
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: panda-ai-linux-x64
          path: dist/panda-ai-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller panda-ai.spec --clean
      - name: Package
        run: |
          cd dist
          if [ -d panda-ai ]; then
            tar czf panda-ai-macos-x64.tar.gz panda-ai/
          elif [ -f panda-ai ]; then
            tar czf panda-ai-macos-x64.tar.gz panda-ai
          fi
          ls -la
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: panda-ai-macos-x64
          path: dist/panda-ai-macos-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller panda-ai.spec --clean
      - name: Package
        run: |
          cd dist
          if (Test-Path panda-ai) {
            Compress-Archive -Path panda-ai -DestinationPath panda-ai-windows-x64.zip
          } elseif (Test-Path panda-ai.exe) {
            Compress-Archive -Path panda-ai.exe -DestinationPath panda-ai-windows-x64.zip
          }
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: panda-ai-windows-x64
          path: dist/panda-ai-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: panda-ai-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t panda-ai:latest .
      - name: Test Docker
        run: |
          docker run -d --name test -p 8000:8000 panda-ai:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz > /dev/null 2>&1 && echo "OK" && docker stop test && exit 0
            sleep 2
          done
          docker logs test; docker stop test; exit 1
