name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile src/config.py && python -m py_compile src/api/server.py && python -m py_compile src/api/openai_routes.py && python -m py_compile src/tokens.py

      - name: Unit tests
        run: python tests/test_integration.py

  build-binary:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    needs: test
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        continue-on-error: true

      - name: Build binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: python -m PyInstaller panda-ai.spec --clean

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller panda-ai.spec --clean

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: panda-ai-${{ matrix.os }}
          path: dist/panda-ai
          if-no-files-found: warn

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: panda-ai-${{ matrix.os }}
          path: dist/panda-ai.exe
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t panda-ai:latest .

      - name: Test Docker image
        run: |
          docker run -d --name test -p 8000:8000 panda-ai:latest
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Gateway is up!"
              docker stop test
              exit 0
            fi
            sleep 2
          done
          echo "Gateway failed to start within 60s"
          docker logs test
          docker stop test
          exit 1
