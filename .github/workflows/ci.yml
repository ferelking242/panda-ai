name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile src/config.py
          python -m py_compile src/api/server.py
          python -m py_compile src/api/openai_routes.py
          python -m py_compile src/tokens.py

      - name: Unit tests
        run: python tests/test_integration.py

  build-binary:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    needs: test
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: python -m PyInstaller panda-ai.spec --clean

      - name: List dist contents
        if: always()
        run: ls -laR dist/ 2>/dev/null || echo "No dist/ folder"

      - name: Package binary
        run: |
          cd dist
          if [ -f panda-ai ]; then
            tar czf panda-ai-${{ runner.os }}-x64.tar.gz panda-ai
          elif [ -d panda-ai ]; then
            tar czf panda-ai-${{ runner.os }}-x64.tar.gz panda-ai/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-ai-${{ runner.os }}-x64
          path: dist/panda-ai-*.tar.gz
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t panda-ai:latest .

      - name: Test Docker image
        run: |
          docker run -d --name test -p 8000:8000 panda-ai:latest
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Gateway is up!"
              docker stop test
              exit 0
            fi
            sleep 2
          done
          echo "Gateway failed to start within 60s"
          docker logs test
          docker stop test
          exit 1
