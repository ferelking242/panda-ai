name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile src/config.py && python -m py_compile src/api/server.py && python -m py_compile src/api/openai_routes.py && python -m py_compile src/tokens.py

      - name: Unit tests
        run: python tests/test_integration.py

  build-binary:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: python -m PyInstaller panda-ai.spec --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panda-ai-${{ matrix.os }}
          path: dist/panda-ai*

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t panda-ai:latest .

      - name: Test Docker image
        run: |
          docker run -d --name test -p 8000:8000 panda-ai:latest
          sleep 5
          curl -sf http://localhost:8000/healthz || exit 1
          docker stop test
