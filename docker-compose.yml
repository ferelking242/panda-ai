services:
  panda-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panda-ai
    ports:
      - "${API_PORT:-8000}:8000"
      - "6080:6080"  # noVNC for browser access (debug/login)
    environment:
      - PROVIDER=${PROVIDER:-gemini}
      - PROVIDER_CHAIN=${PROVIDER_CHAIN:-}
      - API_TOKEN=${API_TOKEN:-}
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - HEADLESS=true
      - VNC_PASSWORD=${VNC_PASSWORD:-catgpt}
      - POOL_SIZE=${POOL_SIZE:-1}
      - RESPONSE_TIMEOUT=${RESPONSE_TIMEOUT:-120000}
      - CACHE_TTL=${CACHE_TTL:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - panda_browser_data:/app/browser_data
      - ./logs:/app/logs
    restart: unless-stopped

  # Next.js dashboard — first boot builds the app (1-2 min), be patient.
  panda-dashboard:
    image: node:20-alpine
    container_name: panda-dashboard
    working_dir: /dashboard
    command: sh -c "npm install --no-audit --no-fund && npm run build && npm run start"
    environment:
      - API_ORIGIN=http://panda-ai:8000
      - PORT=5000
      - NODE_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - ./dashboard:/dashboard
      - panda_dashboard_node_modules:/dashboard/node_modules
      - panda_dashboard_next:/dashboard/.next
    depends_on:
      - panda-ai
    restart: unless-stopped

volumes:
  panda_browser_data:
  panda_dashboard_node_modules:
  panda_dashboard_next:
