<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="panda-ear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00d4ff" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/><line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>
  
  <!-- Glow ring -->
  <circle cx="200" cy="185" r="110" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.2"/>
  <circle cx="200" cy="185" r="120" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.1"/>
  
  <!-- Panda head -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <ellipse cx="130" cy="115" rx="35" ry="32" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <ellipse cx="130" cy="115" rx="20" ry="18" fill="#0f0f0f"/>
    <ellipse cx="270" cy="115" rx="35" ry="32" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <ellipse cx="270" cy="115" rx="20" ry="18" fill="#0f0f0f"/>
    
    <!-- Head -->
    <ellipse cx="200" cy="185" rx="85" ry="80" fill="#f0f0f0"/>
    
    <!-- Eye patches (panda markings) -->
    <ellipse cx="170" cy="170" rx="28" ry="25" fill="#1a1a2e" transform="rotate(-10 170 170)"/>
    <ellipse cx="230" cy="170" rx="28" ry="25" fill="#1a1a2e" transform="rotate(10 230 170)"/>
    
    <!-- Eyes with cyan glow -->
    <ellipse cx="170" cy="170" rx="12" ry="11" fill="#0a0a15"/>
    <ellipse cx="172" cy="168" rx="5" ry="4.5" fill="#00d4ff" opacity="0.9"/>
    <ellipse cx="174" cy="166" rx="2" ry="1.8" fill="#ffffff"/>
    
    <ellipse cx="230" cy="170" rx="12" ry="11" fill="#0a0a15"/>
    <ellipse cx="232" cy="168" rx="5" ry="4.5" fill="#00d4ff" opacity="0.9"/>
    <ellipse cx="234" cy="166" rx="2" ry="1.8" fill="#ffffff"/>
    
    <!-- Nose -->
    <ellipse cx="200" cy="195" rx="8" ry="5" fill="#1a1a2e"/>
    
    <!-- Mouth -->
    <path d="M 192 200 Q 200 210 208 200" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Subtle cyber lines on face -->
    <line x1="145" y1="190" x2="155" y2="195" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="245" y1="190" x2="255" y2="195" stroke="#7b2ff7" stroke-width="0.8" opacity="0.3"/>
  </g>
  
  <!-- Circuit lines extending from panda -->
  <g stroke="url(#glow)" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 115 185 L 80 185 L 80 220 L 55 220"/>
    <circle cx="55" cy="220" r="3" fill="#00d4ff" opacity="0.6"/>
    
    <path d="M 285 185 L 320 185 L 320 220 L 345 220"/>
    <circle cx="345" cy="220" r="3" fill="#7b2ff7" opacity="0.6"/>
    
    <path d="M 200 270 L 200 310 L 160 310"/>
    <circle cx="160" cy="310" r="3" fill="#00d4ff" opacity="0.6"/>
    
    <path d="M 200 310 L 240 310"/>
    <circle cx="240" cy="310" r="3" fill="#7b2ff7" opacity="0.6"/>
  </g>
  
  <!-- "PANDA AI" text -->
  <text x="200" y="340" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="32" font-weight="800" letter-spacing="6" fill="url(#glow)">PANDA AI</text>
  
  <!-- Small tagline -->
  <text x="200" y="365" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" letter-spacing="3" fill="#00d4ff" opacity="0.5">BROWSER GATEWAY</text>
</svg>
